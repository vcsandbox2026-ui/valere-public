<!doctype html>
<html lang="de-CH">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Valère Übersichten</title>
  <style>
    :root {
      --gruen: #455D58;
      --salbei: #6C8A82;
      --taupe: #9D9272;
      --text: #3A3A38;
      --zeile: #F2F1ED;
    }
    body {
      margin: 0;
      background: #FFFFFF;
      color: var(--text);
      font-family: Arial, Helvetica, sans-serif;
      line-height: 1.5;
    }
    header {
      background: var(--gruen);
      color: #FFFFFF;
      padding: 32px 16px;
    }
    main, header > div {
      max-width: 760px;
      margin: 0 auto;
    }
    main { padding: 32px 16px; }
    h1 { margin: 0; font-size: 28px; font-weight: normal; }
    .hinweis {
      background: var(--zeile);
      border-left: 4px solid var(--taupe);
      padding: 16px;
    }
  </style>
</head>
<body>
  <header><div><h1>Valère Übersichten</h1></div></header>
  <main>
    <p class="hinweis">Hier erscheinen freigegebene Charts und Übersichten. Zurzeit ist noch nichts veröffentlicht.</p>
  </main>
</body>
</html>
